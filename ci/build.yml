name: Build & QA

# Runs on push and on pull requests. The build has a hard quality gate:
# any page that violates the on-page SEO rules, or any broken internal link,
# fails the job — so a bad merge can never reach a deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A reduced-depth build keeps CI inside the runner's disk and time budget
      # while still exercising every template, the full SEO gate and the
      # complete internal-link check.
      - name: Build
        run: npm run build
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.websitedesigncompany.site' }}
          BUILD_POSTS_PER_LOCATION: '1'
          BUILD_CASES_PER_LOCATION: '1'
          BUILD_CITY_PAGES: '1'

      - name: QA audit
        run: npx tsx src/build/qa.ts
        env:
          QA_SAMPLE: '1500'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            !dist/**/*.map
          retention-days: 7
          if-no-files-found: error

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            dist/qa-report.json
            dist/seo-report.json
            dist/content-export.json
          retention-days: 30
          if-no-files-found: ignore
